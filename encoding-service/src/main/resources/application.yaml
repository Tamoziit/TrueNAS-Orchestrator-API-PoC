spring:
  application:
    name: encoding-service
  config:
    import: optional:file:.env[.properties]
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: encoding-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"
            use:
              type:
                headers: false
            value:
              default:
                type: com.tamojit.encodingservice.event.VideoUploadedEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8083

nas:
  orchestrator:
    base-url: http://nas-orchestrator:8081

# ffmpeg Config
ffmpeg:
  path: ${FFMPEG_PATH:ffmpeg}

# Temp directory for encoding
encoding:
  base-path: ${TEMP_DIR:/tmp/encoding}

management:
  endpoints:
    web:
      exposure:
        include: health, info